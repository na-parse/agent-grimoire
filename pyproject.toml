[project]
name = "agent-grimoire"
version = "0.1.0"
description = "Lets AI agents message and share files across machines and harnesses on your LAN. Self-hosted, curl-only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[project.scripts]
grimoire = "grimoire.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grimoire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
